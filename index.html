.gh-authcard{position:relative;width:100%;max-width:700px;min-height:480px;border-radius:20px;overflow:hidden;background:#191c29;border:1px solid #2a2e42;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.gh-formpanel{position:absolute;top:0;left:0;width:50%;height:100%;padding:56px 44px 40px;display:flex;flex-direction:column;justify-content:center;gap:14px;background:#191c29;transition:transform .6s ease-in-out,opacity .6s ease-in-out}
.gh-signin{z-index:2}
.gh-authcard.gh-active .gh-signin{transform:translateX(100%)}
.gh-signup{opacity:0;z-index:1}
.gh-authcard.gh-active .gh-signup{transform:translateX(100%);opacity:1;z-index:5;animation:gh-show .6s}
@keyframes gh-show{0%,49.99%{opacity:0;z-index:1}50%,100%{opacity:1;z-index:5}}
.gh-overlay-container{position:absolute;top:0;left:50%;width:50%;height:100%;overflow:hidden;transition:transform .6s ease-in-out;z-index:100}
.gh-authcard.gh-active .gh-overlay-container{transform:translateX(-100%)}
.gh-overlay{position:relative;left:-100%;height:100%;width:200%;background:linear-gradient(135deg,#123044 0%,#0f4b63 45%,#14748f 100%);transform:translateX(0);transition:transform .6s ease-in-out}
.gh-authcard.gh-active .gh-overlay{transform:translateX(50%)}
.gh-overlay-panel{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;top:0;height:100%;width:50%;padding:0 40px;transform:translateX(0);transition:transform .6s ease-in-out}
.gh-overlay-left{transform:translateX(-20%)}
.gh-authcard.gh-active .gh-overlay-left{transform:translateX(0)}
.gh-overlay-right{right:0;transform:translateX(0)}
.gh-authcard.gh-active .gh-overlay-right{transform:translateX(20%)}
.gh-ghost-btn{margin-top:6px;padding:11px 34px;border-radius:999px;border:1.5px solid rgba(255,255,255,.7);background:transparent;color:#fff;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;transition:background-color .15s,transform .08s}
.gh-ghost-btn:hover{background-color:rgba(255,255,255,.12)}
.gh-ghost-btn:active{transform:scale(.96)}
.gh-mobile-toggle{display:none}
@media (max-width:760px){
.gh-authcard{min-height:0}
.gh-overlay-container{display:none}
.gh-formpanel{position:relative;width:100%;padding:28px 22px;transition:none;transform:none!important;opacity:1!important;z-index:1!important;animation:none!important;display:none}
.gh-authcard:not(.gh-active) .gh-signin{display:flex}
.gh-authcard.gh-active .gh-signup{display:flex}
.gh-mobile-toggle{display:block}
}

  <script>
    // Real auth API base — change this if you run the server on a different host/port.
    // PRODUCTION: replace with your deployed API's URL, e.g. "https://gamehub-api.onrender.com/api"
    window.GH_API_BASE = "http://localhost:4000/api";
    window.ghAuthRequest = async function (path, options) {
      options = options || {};
      var headers = { "Content-Type": "application/json" };
      if (options.token) headers["Authorization"] = "Bearer " + options.token;
      var res;
      try {
        res = await fetch(window.GH_API_BASE + path, {
          method: options.method || "POST",
          headers: headers,
          body: options.body ? JSON.stringify(options.body) : undefined,
        });
      } catch (networkErr) {
        throw new Error("Can't reach the server. Is it running at " + window.GH_API_BASE + "?");
      }
      var data = null;
      try { data = await res.json(); } catch (parseErr) {}
      if (!res.ok) {
        throw new Error((data && data.error) || "Something went wrong. Please try again.");
      }
      return data;
    };
  </script>
